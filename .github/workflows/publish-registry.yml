name: Publish MCP Registry metadata

on:
  workflow_dispatch:
    inputs:
      oauth_qualified:
        description: Native host browser OAuth and an authenticated scoped MCP call have passed for this service release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: official-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.oauth_qualified == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check remote metadata, OAuth discovery and existing Registry record
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          import {setTimeout as delay} from 'node:timers/promises';
          const transientStatuses=new Set([408,425,429,500,502,503,504]);
          const transientCodes=new Set(['UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_SOCKET','ECONNRESET','ECONNREFUSED','ENOTFOUND','EAI_AGAIN','ETIMEDOUT','EHOSTUNREACH','ENETUNREACH']);
          async function response(url, expectedStatus=200) {
            for(let attempt=1;attempt<=3;attempt++) {
              const started=Date.now(); let status;
              console.log(`Reading ${url} (attempt ${attempt}/3)`);
              try {
                const response=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(20000)});
                status=response.status;
                console.log(`GET ${url}: HTTP ${status} after ${Date.now()-started}ms`);
                if(status!==expectedStatus) { await response.body?.cancel(); throw new Error('Unexpected HTTP status'); }
                return response;
              } catch(error) {
                const code=status!==undefined&&status!==expectedStatus?`HTTP_${status}`:error?.cause?.code??error?.name??'READ_FAILED';
                const transient=transientStatuses.has(status)||error?.name==='TimeoutError'||transientCodes.has(error?.cause?.code);
                const retry=attempt<3&&transient;
                console.error(`GET ${url} failed: ${code} after ${Date.now()-started}ms; ${retry?'bounded retry follows':'no read result accepted'}`);
                if(!retry) throw new Error(`Required GET ${url} failed (${code}); no read result was accepted.`);
                await delay(attempt*1000);
              }
            }
          }
          async function read(url) { return (await response(url)).json(); }
          const server=JSON.parse(readFileSync('server.json','utf8'));
          assert.equal(server.$schema,'https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json');
          assert.equal(server.name,'io.github.firedrill-tools/firedrill');
          assert.equal(server.version,'2.2.1');
          assert.equal(server.websiteUrl,'https://firedrill.run/agents');
          assert.equal(Object.hasOwn(server,'packages'),false,'Remote-only metadata must not advertise npm installation');
          assert.deepEqual(server.remotes,[{type:'streamable-http',url:'https://mcp.firedrill.run/mcp'}]);
          const metadataUrl='https://mcp.firedrill.run/.well-known/oauth-protected-resource/mcp';
          const challenge=await response(server.remotes[0].url,401);
          assert.match(challenge.headers.get('www-authenticate')??'',/\bBearer\b/i);
          assert((challenge.headers.get('www-authenticate')??'').includes(`resource_metadata="${metadataUrl}"`),'Remote MCP must advertise its public protected-resource metadata');
          await challenge.body?.cancel();
          const metadata=await read(metadataUrl);
          assert.equal(metadata.resource,server.remotes[0].url);
          assert.deepEqual(metadata.authorization_servers,['https://signin.firedrill.run']);
          assert.deepEqual(metadata.bearer_methods_supported,['header']);
          const registry=await read('https://registry.modelcontextprotocol.io/v0.1/servers?search='+encodeURIComponent(server.name));
          const existing=registry.servers.find(item=>item.server.name===server.name&&item.server.version===server.version);
          if(existing) assert.deepEqual(existing.server,server,'Existing immutable Registry version differs; do not publish again');
          appendFileSync(process.env.GITHUB_OUTPUT,'publish='+String(!existing)+'\n');
          console.log(existing?'Exact Registry version already exists.':'Remote discovery confirmed; Registry version is absent. Native OAuth qualification is a separate required release gate.');
          NODE
      - name: Download and verify official publisher
        if: steps.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const b=fs.readFileSync(process.argv[1]);if(b.length!==7339841||crypto.createHash("sha256").update(b).digest("hex")!=="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc")throw Error("Publisher integrity mismatch")' "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish using GitHub Actions identity
        if: steps.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Verify public Registry version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {setTimeout as delay} from 'node:timers/promises';
          const transientStatuses=new Set([408,425,429,500,502,503,504]);
          const transientCodes=new Set(['UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_SOCKET','ECONNRESET','ECONNREFUSED','ENOTFOUND','EAI_AGAIN','ETIMEDOUT','EHOSTUNREACH','ENETUNREACH']);
          async function read(url) {
            for(let attempt=1;attempt<=3;attempt++) {
              const started=Date.now(); let status;
              console.log(`Reading ${url} (attempt ${attempt}/3)`);
              try {
                const response=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(20000)});
                status=response.status;
                console.log(`GET ${url}: HTTP ${status} after ${Date.now()-started}ms`);
                if(status!==200) { await response.body?.cancel(); throw new Error('Unexpected HTTP status'); }
                return await response.json();
              } catch(error) {
                const code=status!==undefined&&status!==200?`HTTP_${status}`:error?.cause?.code??error?.name??'READ_FAILED';
                const transient=transientStatuses.has(status)||error?.name==='TimeoutError'||transientCodes.has(error?.cause?.code);
                const retry=attempt<3&&transient;
                console.error(`GET ${url} failed: ${code} after ${Date.now()-started}ms; ${retry?'bounded retry follows':'no read result accepted'}`);
                if(!retry) throw new Error(`Required GET ${url} failed (${code}); no read result was accepted.`);
                await delay(attempt*1000);
              }
            }
          }
          const expected=JSON.parse(readFileSync('server.json','utf8'));
          const registry=await read('https://registry.modelcontextprotocol.io/v0.1/servers?search='+encodeURIComponent(expected.name));
          const found=registry.servers.find(item=>item.server.name===expected.name&&item.server.version===expected.version);
          assert(found,'Published version is not publicly visible; inspect before another publish');
          assert.deepEqual(found.server,expected);
          console.log('Verified official Registry metadata for '+expected.name+'@'+expected.version);
          NODE
